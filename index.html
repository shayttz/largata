<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Minha Namorada Incrível ❤️</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Mantenha seus estilos anteriores e ADICIONE estes: */
        
        html {
            scroll-behavior: smooth; /* Faz a rolagem ser suave */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #fff0f3;
            color: #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .main-container {
            max-width: 900px;
            width: 100%;
            background-color: #fff;
            padding: 50px;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.1);
            border-radius: 25px;
            text-align: center;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            list-style: none;
            padding: 0;
        }

        .photo-card {
            background-color: #fff;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid transparent; /* Reserva espaço para o destaque */
            transition: all 0.5s ease;
        }

        /* CLASSE DE DESTAQUE (Acionada pelo QR Code) */
        .highlight {
            border-color: #d63384;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(214, 51, 132, 0.4);
            z-index: 10;
        }

        .photo-frame {
            width: 100%;
            padding-top: 100%;
            position: relative;
        }

        .photo-frame img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        figcaption {
            padding: 15px;
            font-style: italic;
            color: #666;
        }

        .heart-icon { color: #d63384; font-size: 3.5em; animation: pulse 1.5s infinite; margin-top: 40px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    </style>
</head>
<body>

<div class="main-container">
    <h1>Para Você, Meu Amor ❤️</h1>

    <div class="letter-content">
        <p>Preparei esta surpresa especial...</p>
    </div>

    <ul class="photo-gallery">
        <li class="photo-card" id="foto1">
            <figure>
                <div class="photo-frame"><img src="fotos/7147D496-CB40-46F2-8115-964654C05D15.jpg"></div>
                <figcaption>Legenda da foto 1...</figcaption>
            </figure>
        </li>

        <li class="photo-card" id="foto2">
            <figure>
                <div class="photo-frame"><img src="fotos/IMG-20210610-WA0174.jpg"></div>
                <figcaption>Legenda da foto 2...</figcaption>
            </figure>
        </li>

        </ul>

    <i class="fas fa-heart heart-icon"></i>
</div>

<script>
    // Função para destacar a foto baseada na URL
    function handleHighlight() {
        // Remove destaque anterior
        document.querySelectorAll('.photo-card').forEach(card => card.classList.remove('highlight'));

        const hash = window.location.hash; // Pega o #foto1 da URL
        if (hash) {
            const targetCard = document.querySelector(hash);
            if (targetCard) {
                targetCard.classList.add('highlight');
                // Opcional: remover o destaque após alguns segundos
                setTimeout(() => {
                    targetCard.classList.remove('highlight');
                }, 5000);
            }
        }
    }

    // Executa quando a página carrega ou quando o hash muda
    window.addEventListener('load', handleHighlight);
    window.addEventListener('hashchange', handleHighlight);
</script>

</body>
</html>
